<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BattleTech Tabletop Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Left: Map Canvas -->
    <div id="map-container">
      <canvas id="map-canvas"></canvas>
    </div>

    <!-- Right: UI Panels -->
    <div id="ui-panel">
      <!-- Phase and Turn Indicator -->
      <div id="phase-bar">
        <span id="phase-label">Phase: --</span>
        <span id="turn-label">Turn: 0</span>
        <span id="active-player">Active: --</span>
      </div>

      <!-- Unit Info -->
      <div id="unit-panel">
        <h3>Unit Info</h3>
        <div id="unit-details">
          <p>Select a unit to view details</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div id="action-panel">
        <h3>Actions</h3>
        <div id="action-buttons">
          <!-- Dynamically populated by phase -->
        </div>
      </div>

      <!-- Weapon Selection -->
      <div id="weapon-panel" style="display:none">
        <h3>Weapons</h3>
        <div id="weapon-list"></div>
        <button id="btn-fire">Fire Selected</button>
      </div>

      <!-- Physical Attack -->
      <div id="physical-panel" style="display:none">
        <h3>Physical Attack</h3>
        <select id="physical-type">
          <option value="punch">Punch</option>
          <option value="kick">Kick</option>
          <option value="charge">Charge</option>
          <option value="dfa">Death From Above</option>
          <option value="push">Push</option>
        </select>
        <button id="btn-physical">Execute Attack</button>
      </div>

      <!-- Movement Controls -->
      <div id="movement-panel" style="display:none">
        <h3>Movement</h3>
        <div id="movement-mode">
          <label><input type="radio" name="moveMode" value="walk" checked> Walk</label>
          <label><input type="radio" name="moveMode" value="run"> Run</label>
          <label><input type="radio" name="moveMode" value="jump"> Jump</label>
        </div>
        <p id="mp-display">MP: 0 / 0</p>
        <button id="btn-confirm-move">Confirm Move</button>
        <button id="btn-cancel-move">Cancel</button>
      </div>
    </div>

    <!-- Bottom: Dice Log -->
    <div id="log-panel">
      <h3>Dice Log</h3>
      <div id="dice-log"></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
